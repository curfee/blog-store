<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>熔塑之树 · Plastic Tree v2</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  /* 加载层外观入口：集中调整进度条、百分比字体与间距。 */
  :root {
    --loading-box-width: 320px;
    --loading-track-height: 2px;
    --loading-track-color: rgba(255, 255, 255, .2);
    --loading-progress-color: #e1ff00;
    --loading-progress-glow: rgba(225, 255, 0, .7);
    --loading-percent-font: Consolas, monospace;
    --loading-percent-size: 11px;
    --loading-percent-color: rgba(255, 255, 255, .62);
    --loading-percent-gap: 9px;
    --background-halftone-dot-step: 3px;
    --background-halftone-dot-core: 1px;
    --background-halftone-dot-mid: 1.6px;
    --background-halftone-dot-mid-alpha: .5;
    --background-halftone-dot-edge: 5.5px;
    --background-mask-reveal-size: 0px;
  }
  @property --background-mask-reveal-size {
    syntax: "<length>";
    inherits: false;
    initial-value: 0px;
  }
  body {
    background-image: url('icon/背景图.webp');
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
  }
  #loading-screen {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: grid;
    place-items: center;
    background: rgba(0, 0, 0, 0.24);
    -webkit-backdrop-filter: blur(9px);
    backdrop-filter: blur(9px);
    opacity: 1;
    transition: opacity var(--loading-fade-duration, 650ms) ease;
    cursor: default;
  }
  #loading-screen.is-ready { opacity: 0; pointer-events: none; }
  .loading-box { width: min(var(--loading-box-width), calc(100vw - 48px)); color: rgba(255,255,255,.86); text-align: center; }
  .loading-label { margin-bottom: 14px; font: 12px/1.5 "Microsoft YaHei", sans-serif; letter-spacing: .18em; }
  #loading-screen.is-waiting .loading-label {
    margin-bottom: 20px;
    color: #e1ff00;
    font-size: 15px;
    letter-spacing: .22em;
    text-shadow: 0 0 14px rgba(225,255,0,.32);
    animation: ready-pulse 1.8s ease-in-out infinite alternate;
  }
  @keyframes ready-pulse { from { opacity: .68; } to { opacity: 1; } }
  .loading-track { height: var(--loading-track-height); overflow: hidden; background: var(--loading-track-color); }
  #loading-progress { width: 0; height: 100%; background: var(--loading-progress-color); box-shadow: 0 0 10px var(--loading-progress-glow); transition: width 180ms ease; }
  #loading-percent { margin-top: var(--loading-percent-gap); font: 400 var(--loading-percent-size)/1.2 var(--loading-percent-font); color: var(--loading-percent-color); font-variant-numeric: tabular-nums; }
  #stage {
    position: absolute;
    width: 2560px;
    height: 1440px;
    transform-origin: top left;
    overflow: hidden;
    isolation: isolate;
  }
  /* 所有图层均为画板 1:1 抠图（全画布 2560×1440），z 序 = 画板文档顺序 */
  #stage .el { position: absolute; left: 0; top: 0; width: 2560px; height: 1440px; }
  #stage img { display: block; width: 100%; height: 100%; }
  #stage #ditu {
    visibility: hidden;
    opacity: 0;
    -webkit-mask-image:
      url('icon/背景底图_mask.svg'),
      radial-gradient(circle, #000 var(--background-halftone-dot-core), rgba(0, 0, 0, var(--background-halftone-dot-mid-alpha)) var(--background-halftone-dot-mid), transparent var(--background-halftone-dot-edge));
    -webkit-mask-position: center, center;
    -webkit-mask-repeat: no-repeat, repeat;
    -webkit-mask-size: 0 0, var(--background-halftone-dot-step) var(--background-halftone-dot-step);
    -webkit-mask-composite: source-in;
    mask-image:
      url('icon/背景底图_mask.svg'),
      radial-gradient(circle, #000 var(--background-halftone-dot-core), rgba(0, 0, 0, var(--background-halftone-dot-mid-alpha)) var(--background-halftone-dot-mid), transparent var(--background-halftone-dot-edge));
    mask-mode: alpha;
    mask-position: center, center;
    mask-repeat: no-repeat, repeat;
    mask-size: 0 0, var(--background-halftone-dot-step) var(--background-halftone-dot-step);
    mask-composite: intersect;
    transition: none;
  }
  #stage #ditu.is-revealing {
    visibility: visible;
    opacity: 1;
    -webkit-mask-size:
      var(--background-mask-reveal-size) var(--background-mask-reveal-size),
      var(--background-halftone-dot-step) var(--background-halftone-dot-step);
    mask-size:
      var(--background-mask-reveal-size) var(--background-mask-reveal-size),
      var(--background-halftone-dot-step) var(--background-halftone-dot-step);
  }
  #stage #ditu-smooth {
    visibility: hidden;
    opacity: 0;
    -webkit-mask: url('icon/背景底图_mask.svg') center / 0 0 no-repeat;
    mask: url('icon/背景底图_mask.svg') center / 0 0 no-repeat;
    mask-mode: alpha;
    transition: none;
  }
  #stage #ditu-smooth.is-revealing {
    visibility: visible;
    opacity: 1;
    -webkit-mask-size: var(--background-mask-reveal-size) var(--background-mask-reveal-size);
    mask-size: var(--background-mask-reveal-size) var(--background-mask-reveal-size);
  }
  #stage #hexin { opacity: 0; }
  #stage #label-jiehuo, #stage #label-yutan,
  #stage #label-renyuan, #stage #label-dangan { opacity: 0; }

  /* 音乐开关（music_fx.js 内联后接管显隐；内联前整体隐藏，防止画板灰底闪显） */
  #stage #music-pause, #stage #music-play { visibility: hidden; }

  /* 例外：这三层用用户导出的 webp，按画板包围盒定位（需双 id 提升优先级） */
  #stage #quyu-l { left: 26.3px;   top: -56.9px; width: 533.2px; height: 1232.7px; }
  #stage #quyu-r { left: 2000.5px; top: -56.9px; width: 533.2px; height: 1232.7px; }
  #stage #heikuai-tex {
    left: 0; top: 0; width: 2560px; height: 1440px;
    -webkit-mask: url('icon/_画板版_底面黑块.svg') center / 100% 100% no-repeat;
    mask: url('icon/_画板版_底面黑块.svg') center / 100% 100% no-repeat;
    mask-mode: alpha;
  }
  #stage #heikuai-tex img { position: absolute; left: -1px; top: 1189px; width: 2598px; height: 215px; }

  /* 以下三层按画板1.svg 权威包围盒定位（画板 1280×720 ×2 = 画布 2560×1440） */
  /* 主支撑图像：内容bbox(119,101)-(1981,1312)/2074×1415 → 目标[207,85]-[2322,1499]，纵向有 ~2.7% 拉伸 */
  #stage #shan { left: 72px; top: 12.7px; width: 2376px; height: 1637.5px; }
  /* 残缺圆：白底细线圆环，multiply 掉白底只留线条；目标[128,87]-[2473,2431]（直径 2345） */
  #stage #canquyuan { left: 675.4px; top: 376.8px; width: 1244.6px; height: 1244.6px; mix-blend-mode: multiply; }
  /* 树状呼吸亮光(webp)：光晕内容 464²/525×526，对齐闪烁光晕圆心 (1300,782)，显示直径 476（画板呼吸层尺寸） */
  #stage #huxi { left: 1029px; top: 512px; width: 539px; height: 539px; }
  /* 圆形_颜色淡化滤镜：Affinity「颜色淡化」即 color-dodge；光晕圆心(1300,1194) 半径811，目标[489,383]-[2112,2006] */
  #stage #pinkglow { left: 583.4px; top: 947.6px; width: 1423px; height: 1423px; mix-blend-mode: color-dodge; }
</style>
<script src="scripts/config/animation_timing.js?v=dual-mask-1"></script>
